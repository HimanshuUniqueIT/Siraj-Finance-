<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siraj CRM — User Stories & Prerequisites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#1c1b1b; --navy-900:#2b2a29; --navy-800:#3a3836;
    --steel-100:#f2f0ee; --steel-200:#e3dfda; --steel-400:#a9a09a; --steel-600:#726a63;
    --ink:#1c1b1b; --ink-soft:#54504b;
    --gold:#c9a13b; --gold-dark:#a8752a;
    --teal:#0f6e56; --teal-bg:#e1f5ee;
    --coral:#993c1d; --coral-bg:#faece7;
    --purple:#726a63; --purple-bg:#efece8;
    --bg:#f7f5f2; --card:#ffffff; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,-apple-system,sans-serif; font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.disp{font-family:'Plus Jakarta Sans',system-ui,sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  .topband{background:linear-gradient(180deg,var(--navy-950),var(--navy-900)); color:#fff; padding:26px 28px 26px; border-bottom:3px solid var(--gold);}
  .topband-inner{max-width:1720px;margin:0 auto; display:flex; align-items:center; gap:22px;}
  .topband-logo{height:56px; width:auto; flex-shrink:0; background:#fff; padding:8px 14px; border-radius:8px;}
  .topband-text{min-width:0;}
  .eyebrow{text-transform:uppercase; letter-spacing:.12em; font-size:15px; color:var(--steel-400); font-weight:500; margin:0 0 10px;}
  .topband h1{font-size:34px; font-weight:600; margin:0 0 4px; letter-spacing:-.01em;}
  .topband p{margin:0; font-size:18px; color:var(--steel-400); max-width:900px; line-height:1.6;}

  .shell{max-width:1720px; margin:0 auto; display:grid; grid-template-columns:280px 1fr; gap:32px; padding:32px 28px 70px;}
  @media (max-width:860px){.shell{grid-template-columns:1fr; padding:20px;}}

  .side{position:sticky; top:20px; align-self:start;}
  .side-label{font-size:14px; text-transform:uppercase; letter-spacing:.1em; color:var(--steel-600); font-weight:600; margin:0 0 10px 4px;}
  .role-btn{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:transparent; border:none; border-left:3px solid transparent;
    padding:12px 14px; margin-bottom:3px; border-radius:0 8px 8px 0; cursor:pointer;
    font-family:'Inter',sans-serif; font-size:17px; font-weight:500; color:var(--ink-soft);
    transition:background .15s, color .15s, border-color .15s;
  }
  .role-btn .rb-dot{width:8px;height:8px;border-radius:50%; background:var(--steel-400); flex-shrink:0;}
  .role-btn:hover{background:var(--steel-100);}
  .role-btn.active{background:#fff; border-left-color:var(--gold); color:var(--navy-950); box-shadow:0 1px 3px rgba(10,28,51,.08);}
  .role-btn.active .rb-dot{background:var(--gold-dark);}
  .role-count{margin-left:auto; font-size:13.5px; color:var(--steel-600); font-family:'IBM Plex Mono',monospace;}

  .panel{min-width:0;}
  .role-head{background:var(--card); border:1px solid var(--steel-200); border-radius:var(--radius); padding:28px 32px; margin-bottom:22px;}
  .role-head .rh-top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .role-head h2{font-size:32px; margin:0 0 8px; color:var(--navy-950);}
  .role-head .mandate{font-size:19.5px; color:var(--ink-soft); line-height:1.65; margin:0; max-width:900px;}
  .badge{display:inline-block; font-size:15px; font-weight:600; letter-spacing:.03em; padding:7px 14px; border-radius:20px; background:var(--teal-bg); color:var(--teal); white-space:nowrap;}

  .flow{position:relative; padding-left:6px;}
  .step{display:grid; grid-template-columns:46px 1fr; gap:18px; position:relative; padding-bottom:26px;}
  .step:last-child{padding-bottom:0;}
  .step-rail{position:relative; display:flex; justify-content:center;}
  .step-num{width:38px;height:38px; border-radius:50%; background:var(--navy-900); color:#fff; display:flex;align-items:center;justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:500; z-index:2; flex-shrink:0;}
  .step-line{position:absolute; top:38px; bottom:-26px; left:50%; transform:translateX(-50%); width:2px; background:var(--steel-200); z-index:1;}
  .step:last-child .step-line{display:none;}
  .step-card{background:var(--card); border:1px solid var(--steel-200); border-radius:var(--radius); padding:20px 24px;}
  .step-card .sc-top{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:5px;}
  .step-card h3{font-size:21px; margin:0; color:var(--navy-950); font-weight:600;}
  .step-card p{margin:0; font-size:18px; color:var(--ink-soft); line-height:1.65;}
  .tag{font-size:13.5px; font-weight:600; padding:5px 12px; border-radius:6px; white-space:nowrap; font-family:'IBM Plex Mono',monospace; letter-spacing:.02em;}
  .tag.sys{background:var(--steel-100); color:var(--steel-600);}
  .tag.gate{background:var(--coral-bg); color:var(--coral);}
  .tag.out{background:var(--teal-bg); color:var(--teal);}
  .tag.role{background:var(--navy-900); color:#fff;}
  .tag.ai{background:var(--purple-bg); color:var(--purple);}
  .tag.auto{background:var(--steel-100); color:var(--steel-600);}
  .auto-note{margin-top:10px; font-size:16.5px; color:var(--steel-600); line-height:1.6; font-style:italic;}
  .auto-note b{font-style:normal; font-weight:600; color:var(--ink-soft);}

  .ai-block{margin-top:14px; padding:16px 18px; background:var(--purple-bg); border-radius:8px; border-left:3px solid var(--purple);}
  .ai-block .ai-label{font-size:13.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--purple); margin-bottom:10px; display:block;}
  .ai-row{display:grid; grid-template-columns:90px 1fr; gap:12px; margin-bottom:8px;}
  .ai-row:last-child{margin-bottom:0;}
  .ai-row .ai-k{font-size:15px; font-weight:600; color:var(--purple);}
  .ai-row .ai-v{font-size:17px; color:var(--ink-soft); line-height:1.6;}

  .example-btn{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:var(--navy-900); border:none; border-left:3px solid transparent;
    padding:10px 12px; margin-bottom:14px; border-radius:8px; cursor:pointer;
    font-family:'Inter',sans-serif; font-size:15.5px; font-weight:600; color:#fff;
    transition:background .15s;
  }
  .example-btn:hover{background:var(--navy-800);}
  .example-btn.active{background:var(--gold); color:var(--navy-950); border-left-color:var(--gold-dark);}
  .example-btn i{font-size:17px;}
  .example-btn{font-size:17px;}
  .impl-card{background:var(--card); border:1px solid var(--steel-200); border-radius:var(--radius); padding:28px 32px; margin-top:8px;}
  .impl-card h3{font-size:25px; margin:0 0 6px; color:var(--navy-950);}
  .impl-card>p{font-size:18px; color:var(--ink-soft); line-height:1.65; margin:0 0 20px;}
  .impl-row{display:grid; grid-template-columns:230px 1fr; gap:20px; padding:18px 0; border-top:1px solid var(--steel-200);}
  .impl-row:first-of-type{border-top:none;}
  .impl-mod{font-size:17px; font-weight:600; color:var(--navy-900); line-height:1.5;}
  .impl-mod .impl-phase{display:block; font-size:13.5px; font-weight:500; color:var(--steel-600); font-family:'IBM Plex Mono',monospace; margin-top:4px;}
  .impl-detail{font-size:18px; color:var(--ink-soft); line-height:1.65;}
  .nav-divider{border:none; border-top:1px solid var(--steel-200); margin:14px 4px 12px;}

  .explain-card{background:var(--card); border:1px solid var(--steel-200); border-radius:var(--radius); padding:28px 32px; margin-bottom:22px;}
  .explain-card h3{font-size:23px; margin:0 0 10px; color:var(--navy-950);}
  .explain-card p{font-size:18px; color:var(--ink-soft); line-height:1.7; margin:0 0 14px;}
  .explain-card p:last-child{margin-bottom:0;}
  .check-table{width:100%; border-collapse:collapse; margin-top:6px;}
  .check-table th{text-align:left; font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--steel-600); font-weight:600; padding:0 14px 10px 0; border-bottom:2px solid var(--steel-200);}
  .check-table td{font-size:17.5px; color:var(--ink-soft); line-height:1.6; padding:16px 14px 16px 0; border-bottom:1px solid var(--steel-200); vertical-align:top;}
  .check-table tr:last-child td{border-bottom:none;}
  .check-table td.chk-name{font-weight:600; color:var(--navy-950); white-space:nowrap;}
  .vendor-list{list-style:none; padding:0; margin:10px 0 0;}
  .vendor-list li{display:flex; gap:14px; padding:14px 0; border-top:1px solid var(--steel-200); font-size:17.5px; color:var(--ink-soft); line-height:1.6;}
  .vendor-list li:first-child{border-top:none;}
  .vendor-list b{color:var(--navy-950); min-width:290px; flex-shrink:0;}
  .simple-list{list-style:none; padding:0; margin:10px 0 0;}
  .simple-list li{display:flex; gap:12px; padding:13px 0; border-top:1px solid var(--steel-200); font-size:17.5px; color:var(--ink-soft); line-height:1.6;}
  .simple-list li:first-child{border-top:none;}
  .simple-list li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold-dark);flex-shrink:0;margin-top:8px;}
  .priority-pill{font-size:13px; font-weight:600; padding:4px 10px; border-radius:12px; background:var(--coral-bg); color:var(--coral); white-space:nowrap; font-family:'IBM Plex Mono',monospace;}
  .fr-id{font-family:'IBM Plex Mono',monospace; font-size:15.5px; color:var(--steel-600); font-weight:600;}
  .flow-num-list{counter-reset:flownum; margin:10px 0 0; padding:0;}
  .flow-num-item{display:grid; grid-template-columns:38px 1fr; gap:16px; padding:14px 0; border-top:1px solid var(--steel-200);}
  .flow-num-item:first-child{border-top:none;}
  .flow-num-item .fn-badge{width:32px; height:32px; border-radius:50%; background:var(--navy-900); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:500;}
  .flow-num-item .fn-text{font-size:17.5px; color:var(--ink-soft); line-height:1.65;}
  .flow-num-item .fn-text b{color:var(--navy-950);}
  .open-item{background:var(--coral-bg); border-radius:8px; padding:16px 18px; margin-top:10px; font-size:17px; color:var(--coral); line-height:1.6;}
  .open-item b{display:block; margin-bottom:4px;}

  .glossary-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:0;}
  @media (max-width:900px){.glossary-grid{grid-template-columns:1fr;}}
  .gloss-item{padding:18px 20px 18px 0; border-top:1px solid var(--steel-200);}
  .glossary-grid .gloss-item:nth-child(1),
  .glossary-grid .gloss-item:nth-child(2){border-top:none;}
  .gloss-term{display:flex; align-items:baseline; gap:10px; margin-bottom:6px;}
  .gloss-term .gt-short{font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:600; color:var(--navy-950);}
  .gloss-term .gt-long{font-size:15.5px; color:var(--steel-600); font-style:italic;}
  .gloss-def{font-size:17.5px; color:var(--ink-soft); line-height:1.65; margin:0;}

  footer{max-width:1720px; margin:0 auto; padding:0 28px 40px; font-size:15.5px; color:var(--steel-600);}

  .step-card{cursor:pointer; transition:border-color .15s, box-shadow .15s;}
  .step-card:hover{border-color:var(--gold); box-shadow:0 2px 8px rgba(10,28,51,.08);}
  .step-card .sc-hint{font-size:13.5px; color:var(--steel-600); margin-top:10px; display:flex; align-items:center; gap:5px;}

  .illus-backdrop{
    position:fixed; inset:0; background:rgba(10,28,51,.35);
    opacity:0; pointer-events:none; transition:opacity .2s; z-index:40;
  }
  .illus-backdrop.open{opacity:1; pointer-events:auto;}

  .illus-panel{
    position:fixed; top:0; right:0; height:100%; width:420px; max-width:88vw;
    background:var(--card); box-shadow:-8px 0 24px rgba(10,28,51,.18);
    transform:translateX(100%); transition:transform .25s ease; z-index:50;
    display:flex; flex-direction:column; overflow-y:auto;
  }
  .illus-panel.open{transform:translateX(0);}
  .illus-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:22px 24px 14px; border-bottom:1px solid var(--steel-200);}
  .illus-head h3{font-size:21.5px; margin:0; color:var(--navy-950); line-height:1.4;}
  .illus-close{
    background:var(--steel-100); border:none; border-radius:50%; width:32px; height:32px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    font-size:18px; color:var(--ink-soft); line-height:1;
  }
  .illus-close:hover{background:var(--steel-200);}
  .illus-art{padding:28px 24px 8px; display:flex; justify-content:center;}
  .illus-art svg{width:100%; max-width:260px; height:auto;}
  .illus-caption{padding:14px 24px 28px; font-size:17px; color:var(--ink-soft); line-height:1.65;}
  .illus-caption b{color:var(--navy-950);}
</style>
</head>

function pickIcon(title){
  const t = title.toLowerCase();
  if(t.includes('enquir')) return ICONS.enquire;
  if(t.includes('lead') && !t.includes('convert')) return ICONS.formLead;
  if(t.includes('convert') || t.includes('customer record') || t.includes('customer &')) return ICONS.idCard;
  if(t.includes('checklist')) return ICONS.checklistLink;
  if(t.includes('upload') || t.includes('document')) return ICONS.uploadCloud;
  if(t.includes('verif') || t.includes('monitor')) return ICONS.checkPerson;
  if(t.includes('kyc') || t.includes('aml') || t.includes('complian') || t.includes('screen') || t.includes('risk')) return ICONS.shieldCheck;
  if(t.includes('credit') || t.includes('approv') || t.includes('condition') || t.includes('decision')) return ICONS.handshakeCheck;
  if(t.includes('fol') || t.includes('offer letter') || t.includes('lock')) return ICONS.lockedDoc;
  if(t.includes('accept') || t.includes('sign')) return ICONS.signPen;
  if(t.includes('rout')) return ICONS.routeArrows;
  if(t.includes('disburs') || t.includes('activat') || t.includes('cheque') || t.includes('incentive') || t.includes('guarantee')) return ICONS.coinsBank;
  if(t.includes('purchase') || t.includes('flat') || t.includes('facility activ')) return ICONS.houseKey;
  if(t.includes('dashboard') || t.includes('report')) return ICONS.barChart;
  if(t.includes('notif') || t.includes('messag') || t.includes('communicat') || t.includes('email')) return ICONS.messageNotify;
  if(t.includes('branch') || t.includes('hierarchy') || t.includes('role') || t.includes('permission') || t.includes('admin') || t.includes('template') || t.includes('audit')) return ICONS.gear;
  return ICONS.gear;
}

function openIllustration(title, caption){
  document.getElementById('illusTitle').textContent = title;
  document.getElementById('illusArt').innerHTML = pickIcon(title);
  document.getElementById('illusCaption').innerHTML = caption;
  document.getElementById('illusPanel').classList.add('open');
  document.getElementById('illusBackdrop').classList.add('open');
}
function closeIllustration(){
  document.getElementById('illusPanel').classList.remove('open');
  document.getElementById('illusBackdrop').classList.remove('open');
}

// Attach click handlers to every rendered step card (delegated, survives re-renders)
panelEl.addEventListener('click', (e) => {
  const card = e.target.closest('.step-card');
  if(!card) return;
  const title = card.dataset.title;
  const caption = card.dataset.caption;
  if(title) openIllustration(title, caption);
});
</script>
